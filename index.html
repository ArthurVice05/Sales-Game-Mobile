<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>Sales Game</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: local('Inter'), local('Inter var');
        font-weight: 100 900;
      }
      html, body, #root { height: 100%; margin: 0; background:#0E0E0E; }
      *{ box-sizing:border-box; }
    </style>
    <script>
      if (typeof Object.hasOwn !== 'function') {
        Object.defineProperty(Object, 'hasOwn', {
          value: function (object, property) {
            return Object.prototype.hasOwnProperty.call(object, property)
          },
          configurable: true,
          writable: true
        })
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
